# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: dont-worry-ai-challenge-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    preDeployCommand: node node_modules/prisma/build/index.js migrate deploy
    envVars:
      - key: APP_TARGET
        value: api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: dont-worry-ai-challenge-db
          property: connectionString
      - key: ACTIVATION_CODE_PEPPER
        generateValue: true
      - key: DEVICE_CREDENTIAL_SECRET
        generateValue: true
      - key: PUSH_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WORKER_ENABLED
        value: 'true'
      - key: WEB_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: template
      - key: LLM_DEVICE_MINUTE_LIMIT
        value: 6
      - key: LLM_GLOBAL_DAILY_LIMIT
        value: 500

  - type: web
    name: dont-worry-ai-challenge-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /demo
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_TARGET
        value: web
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_VAPID_KEY
        sync: false

databases:
  - name: dont-worry-ai-challenge-db
    databaseName: dontworry
    user: dontworry
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: '17'
    diskSizeGB: 15
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
